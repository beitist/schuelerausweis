# ============================================================================
# Nginx Konfiguration für Hagen-ID PWA (Schüler-App)
# ============================================================================
# Security-gehärtet für Produktion
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ======================================================================
    # SECURITY HEADERS
    # ======================================================================
    # Schützen gegen Clickjacking, MIME-Sniffing, XSS und andere Angriffe.

    # Verhindert Clickjacking (Seite kann nicht in iframe eingebettet werden)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Verhindert MIME-Type Sniffing (Browser rät Dateityp nicht selbst)
    add_header X-Content-Type-Options "nosniff" always;

    # XSS-Schutz für ältere Browser (moderne nutzen CSP)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy: Kein Referrer an externe Seiten senden
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy: Nicht benötigte Browser-Features abschalten
    # camera=() statt camera=(self), da die PWA die Kamera NICHT über Nginx nutzt
    # (QR-Scanner läuft client-seitig via JavaScript, nicht über Nginx)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Content Security Policy (CSP)
    # WICHTIG: Das ist der Hauptschutz gegen XSS-Angriffe!
    # - 'self': Nur eigene Ressourcen laden
    # - 'unsafe-inline' bei style-src: React braucht inline-styles
    # - data: / blob: bei img-src: Base64-Fotos und QR-Code-Rendering
    # - connect-src: API-Aufrufe zur Backend-API erlauben
    # - frame-ancestors 'none': Kein Einbetten in iframes (wie X-Frame-Options, aber moderner)
    # - object-src 'none': explizit (nicht nur implizit über default-src)
    # WICHTIG: connect-src an die EIGENE API-Domain anpassen (nur die Prod-API).
    # Fuer lokale Entwicklung ggf. http://localhost:8000 ergaenzen -
    # aber NIEMALS in der Prod-Config lassen.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.example.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # HSTS: Browser soll NUR HTTPS verwenden (1 Jahr)
    # Nur sinnvoll wenn HTTPS gesichert funktioniert (bei Coolify = ja)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ======================================================================
    # GZIP KOMPRESSION
    # ======================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # ======================================================================
    # CACHING
    # ======================================================================

    # Health-Check für Container-Orchestrierung (Coolify, Docker)
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Security: Versteckte Dateien (.env, .git, etc.) blockieren
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Gefährliche Dateitypen blockieren
    location ~* \.(git|env|sql|log|bak|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Service Worker: NIEMALS cachen!
    # Sonst können Updates nicht ausgeliefert werden
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Manifest: Kurzes Caching (für PWA-Installation/Updates)
    location ~ /manifest\.(json|webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        types {
            application/manifest+json webmanifest;
            application/json json;
        }
    }

    # HTML/JSON: Nicht cachen (damit Deployments sofort sichtbar)
    location ~* \.(html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Statische Assets: Langzeit-Caching (Vite baut Content-Hash in Dateinamen)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA: Alle unbekannten Routen an index.html delegieren (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
