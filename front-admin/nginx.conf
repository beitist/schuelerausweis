# ============================================================================
# Nginx Konfiguration für Hagen-ID Admin-Frontend
# ============================================================================
# Security-gehärtet für Produktion
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ======================================================================
    # SECURITY HEADERS
    # ======================================================================

    # Verhindert Clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Verhindert MIME-Type Sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS-Schutz für ältere Browser
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy: Kein Referrer an externe Seiten
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy: Keine besonderen Browser-Features nötig
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Content Security Policy (CSP)
    # - 'unsafe-inline' bei style-src: React braucht inline-styles
    # - data: bei img-src: Base64-Vorschaubilder bei CSV-Import
    # - connect-src: API-Aufrufe zur Backend-API
    # - object-src 'none': explizit (nicht nur implizit über default-src)
    # WICHTIG: connect-src an die EIGENE API-Domain anpassen (nur die Prod-API).
    # Fuer lokale Entwicklung ggf. http://localhost:8000 ergaenzen -
    # aber NIEMALS in der Prod-Config lassen.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.example.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # HSTS: Browser soll NUR HTTPS verwenden (1 Jahr)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ======================================================================
    # GZIP KOMPRESSION
    # ======================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    # ======================================================================
    # CACHING & ROUTING
    # ======================================================================

    # Health-Check für Container-Orchestrierung
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Security: Versteckte Dateien blockieren
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Gefährliche Dateitypen blockieren
    location ~* \.(git|env|sql|log|bak|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # HTML: Nicht cachen (Deployments sofort sichtbar)
    location ~* \.(html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Statische Assets: Langzeit-Caching (Vite Content-Hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA: Alle Routen an index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
