<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="12" fill="url(#bg-grad)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b" letter-spacing="0.02em">Verifizierungsablauf: QR-Code-Scan bis Ergebnis</text>

  <!-- ================ ROW 1: QR-Code Inhalt ================ -->

  <!-- QR-Code Icon Box -->
  <rect x="40" y="68" width="100" height="100" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Simplified QR pattern -->
  <rect x="58" y="86" width="18" height="18" rx="2" fill="#1e293b"/>
  <rect x="82" y="86" width="18" height="18" rx="2" fill="#1e293b"/>
  <rect x="58" y="110" width="18" height="18" rx="2" fill="#1e293b"/>
  <rect x="82" y="110" width="8" height="8" rx="1" fill="#94a3b8"/>
  <rect x="94" y="110" width="8" height="8" rx="1" fill="#1e293b"/>
  <rect x="106" y="86" width="8" height="8" rx="1" fill="#94a3b8"/>
  <rect x="106" y="98" width="8" height="8" rx="1" fill="#1e293b"/>
  <rect x="106" y="110" width="8" height="8" rx="1" fill="#94a3b8"/>
  <rect x="82" y="122" width="8" height="8" rx="1" fill="#94a3b8"/>
  <rect x="94" y="122" width="8" height="8" rx="1" fill="#1e293b"/>
  <text x="90" y="153" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">QR-Code</text>

  <!-- Arrow from QR to content breakdown -->
  <line x1="150" y1="118" x2="184" y2="118" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- QR-Code Content Breakdown -->
  <rect x="192" y="68" width="280" height="100" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="332" y="89" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b" text-transform="uppercase" letter-spacing="0.08em">QR-CODE-INHALT</text>

  <!-- Content items -->
  <rect x="204" y="98" width="120" height="26" rx="5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="264" y="115" text-anchor="middle" font-size="10.5" font-weight="500" fill="#6d28d9">Schueler-ID (UUID)</text>

  <rect x="332" y="98" width="62" height="26" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="363" y="115" text-anchor="middle" font-size="10.5" font-weight="500" fill="#1d4ed8">TOTP</text>

  <rect x="402" y="98" width="58" height="26" rx="5" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="431" y="115" text-anchor="middle" font-size="10.5" font-weight="500" fill="#92400e">Session</text>

  <rect x="204" y="132" width="80" height="26" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="244" y="149" text-anchor="middle" font-size="10.5" font-weight="500" fill="#475569">Timestamp</text>

  <rect x="292" y="132" width="168" height="26" rx="5" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1"/>
  <text x="376" y="149" text-anchor="middle" font-size="10.5" font-weight="500" fill="#9d174d">ECDSA-Signatur</text>

  <!-- Arrow from content to server -->
  <line x1="482" y1="118" x2="516" y2="118" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Server Box -->
  <rect x="524" y="72" width="110" height="92" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Server icon -->
  <rect x="562" y="88" width="34" height="6" rx="2" fill="#94a3b8"/>
  <circle cx="590" cy="91" r="2" fill="#22c55e"/>
  <rect x="562" y="98" width="34" height="6" rx="2" fill="#94a3b8"/>
  <circle cx="590" cy="101" r="2" fill="#22c55e"/>
  <rect x="562" y="108" width="34" height="6" rx="2" fill="#64748b"/>
  <text x="579" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#e2e8f0">API-Server</text>
  <text x="579" y="148" text-anchor="middle" font-size="9" fill="#94a3b8">Verifizierung</text>

  <!-- ================ ROW 2: Three Checks ================ -->

  <!-- Arrow down from server to checks -->
  <line x1="579" y1="172" x2="579" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decorative line connecting all three checks -->
  <line x1="172" y1="260" x2="390" y2="260" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="620" y1="260" x2="840" y2="260" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Check 1: TOTP -->
  <rect x="102" y="220" width="230" height="80" rx="10" fill="#fff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="102" y="220" width="230" height="80" rx="10" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="102" y="220" width="6" height="80" rx="3" fill="#3b82f6"/>

  <text x="120" y="244" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.06em">PRUEFUNG 1</text>
  <text x="120" y="264" font-size="13" font-weight="600" fill="#1e293b">TOTP-Code gueltig?</text>
  <text x="120" y="282" font-size="10.5" fill="#64748b">Zeitfenster: aktuell &plusmn;30 Sek.</text>
  <text x="120" y="294" font-size="10.5" fill="#64748b">Server berechnet eigenen Code</text>

  <!-- Arrow -->
  <line x1="340" y1="260" x2="394" y2="260" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Check 2: Signatur -->
  <rect x="402" y="220" width="230" height="80" rx="10" fill="#fff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="402" y="220" width="6" height="80" rx="3" fill="#7c3aed"/>

  <text x="420" y="244" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.06em">PRUEFUNG 2</text>
  <text x="420" y="264" font-size="13" font-weight="600" fill="#1e293b">ECDSA-Signatur gueltig?</text>
  <text x="420" y="282" font-size="10.5" fill="#64748b">Public Key aus Datenbank</text>
  <text x="420" y="294" font-size="10.5" fill="#64748b">Signiert gesamten QR-Inhalt</text>

  <!-- Arrow -->
  <line x1="640" y1="260" x2="694" y2="260" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Check 3: Session -->
  <rect x="702" y="220" width="220" height="80" rx="10" fill="#fff" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="702" y="220" width="6" height="80" rx="3" fill="#eab308"/>

  <text x="720" y="244" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.06em">PRUEFUNG 3</text>
  <text x="720" y="264" font-size="13" font-weight="600" fill="#1e293b">Session aktiv?</text>
  <text x="720" y="282" font-size="10.5" fill="#64748b">Highlander: Nur 1 Geraet</text>
  <text x="720" y="294" font-size="10.5" fill="#64748b">Token-Hash muss uebereinstimmen</text>

  <!-- ================ ROW 3: Results ================ -->

  <!-- Arrow from Check 3 down to decision -->
  <path d="M 812 308 L 812 350 L 660 350" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 217 308 L 217 350 L 360 350" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="517" y1="308" x2="517" y2="340" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision Diamond (simplified as rounded rect) -->
  <rect x="368" y="340" width="284" height="44" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="510" y="367" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Alle 3 Pruefungen bestanden?</text>

  <!-- Arrow to Valid -->
  <line x1="400" y1="392" x2="400" y2="422" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="380" y="414" text-anchor="middle" font-size="10" font-weight="600" fill="#16a34a">JA</text>

  <!-- Arrow to Invalid -->
  <line x1="620" y1="392" x2="620" y2="422" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="642" y="414" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">NEIN</text>

  <!-- Valid Result -->
  <rect x="286" y="430" width="228" height="70" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2" filter="url(#shadow)"/>
  <!-- Checkmark circle -->
  <circle cx="318" cy="465" r="16" fill="#16a34a"/>
  <path d="M 310 465 L 315 470 L 326 459" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="344" y="458" font-size="14" font-weight="700" fill="#16a34a">GUELTIG</text>
  <text x="344" y="476" font-size="10.5" fill="#166534">Name + Foto werden angezeigt</text>

  <!-- Invalid Result -->
  <rect x="534" y="430" width="228" height="70" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" filter="url(#shadow)"/>
  <!-- X circle -->
  <circle cx="566" cy="465" r="16" fill="#dc2626"/>
  <path d="M 559 458 L 573 472 M 573 458 L 559 472" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="592" y="458" font-size="14" font-weight="700" fill="#dc2626">UNGUELTIG</text>
  <text x="592" y="476" font-size="10.5" fill="#991b1b">Ausweis abgelehnt</text>

  <!-- Time annotation -->
  <rect x="738" y="82" width="186" height="56" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="831" y="103" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Zeitfaktor</text>
  <text x="831" y="119" text-anchor="middle" font-size="10" fill="#92400e">QR-Code wechselt alle 30 Sek.</text>
  <text x="831" y="131" text-anchor="middle" font-size="10" fill="#92400e">Screenshot = nach 30s wertlos</text>
</svg>
