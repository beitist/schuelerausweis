<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#3b82f6"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.3" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="580" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1"/>
  <rect width="960" height="580" rx="12" fill="url(#grid)"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b" letter-spacing="0.02em">Systemarchitektur: Hagen-ID</text>

  <!-- ================ LEFT: Users ================ -->

  <!-- Schueler with Phone -->
  <rect x="30" y="130" width="130" height="130" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Phone icon -->
  <rect x="72" y="148" width="28" height="46" rx="4" fill="none" stroke="#475569" stroke-width="1.8"/>
  <rect x="76" y="154" width="20" height="30" rx="1" fill="#dbeafe"/>
  <circle cx="86" cy="189" r="2" fill="#475569"/>
  <text x="95" y="212" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Schueler</text>
  <text x="95" y="226" text-anchor="middle" font-size="9.5" fill="#64748b">Smartphone</text>
  <text x="95" y="239" text-anchor="middle" font-size="9.5" fill="#64748b">(PWA im Browser)</text>

  <!-- Admin with Laptop -->
  <rect x="30" y="310" width="130" height="130" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Laptop icon -->
  <rect x="62" y="330" width="46" height="30" rx="3" fill="none" stroke="#475569" stroke-width="1.8"/>
  <rect x="66" y="334" width="38" height="22" rx="1" fill="#ede9fe"/>
  <rect x="54" y="362" width="62" height="4" rx="2" fill="#475569"/>
  <text x="95" y="388" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Schulverwaltung</text>
  <text x="95" y="402" text-anchor="middle" font-size="9.5" fill="#64748b">Admin-Dashboard</text>
  <text x="95" y="415" text-anchor="middle" font-size="9.5" fill="#64748b">(Browser)</text>

  <!-- Verifizierer -->
  <rect x="30" y="480" width="130" height="72" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="95" y="514" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Verifizierer</text>
  <text x="95" y="530" text-anchor="middle" font-size="9.5" fill="#64748b">QR-Code scannen</text>
  <text x="95" y="543" text-anchor="middle" font-size="9.5" fill="#64748b">(beliebiges Geraet)</text>

  <!-- ================ MIDDLE: Internet / HTTPS ================ -->

  <!-- HTTPS Zone -->
  <rect x="190" y="102" width="90" height="466" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1" stroke-dasharray="6,3" opacity="0.7"/>
  <text x="235" y="122" text-anchor="middle" font-size="9" font-weight="600" fill="#16a34a" letter-spacing="0.06em">HTTPS</text>

  <!-- Lock icon -->
  <rect x="226" y="132" width="18" height="14" rx="3" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <path d="M 229 132 L 229 126 Q 229 120 235 120 Q 241 120 241 126 L 241 132" fill="none" stroke="#16a34a" stroke-width="1.5"/>

  <!-- Arrows from users to HTTPS zone -->
  <line x1="168" y1="195" x2="210" y2="195" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="168" y1="375" x2="210" y2="375" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="168" y1="516" x2="210" y2="516" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrows from HTTPS zone to reverse proxy -->
  <line x1="288" y1="195" x2="340" y2="300" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="288" y1="375" x2="340" y2="330" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="288" y1="516" x2="340" y2="340" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ================ Reverse Proxy ================ -->
  <rect x="348" y="290" width="120" height="66" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="408" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#e2e8f0">Reverse Proxy</text>
  <text x="408" y="332" text-anchor="middle" font-size="9.5" fill="#94a3b8">Nginx / Coolify</text>
  <text x="408" y="346" text-anchor="middle" font-size="9" fill="#94a3b8">TLS-Terminierung</text>

  <!-- ================ RIGHT: Docker Environment ================ -->

  <!-- Docker boundary -->
  <rect x="510" y="62" width="422" height="498" rx="12" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,4"/>
  <rect x="526" y="52" width="118" height="22" rx="4" fill="#f8fafc"/>
  <text x="585" y="67" text-anchor="middle" font-size="10" font-weight="600" fill="#475569" letter-spacing="0.06em">DOCKER-UMGEBUNG</text>

  <!-- ===== Public Network Zone ===== -->
  <rect x="526" y="82" width="390" height="240" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" opacity="0.5"/>
  <text x="540" y="100" font-size="9" font-weight="600" fill="#3b82f6" letter-spacing="0.06em">FRONTEND-NETZWERK</text>

  <!-- PWA Container -->
  <rect x="542" y="112" width="172" height="90" rx="10" fill="#fff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="542" y="112" width="172" height="28" rx="10" fill="#dbeafe"/>
  <rect x="542" y="130" width="172" height="2" fill="#93c5fd"/>
  <!-- React icon placeholder -->
  <circle cx="560" cy="126" r="7" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
  <circle cx="560" cy="126" r="2" fill="#3b82f6"/>
  <text x="574" y="130" font-size="11" font-weight="600" fill="#1e293b">Schueler-PWA</text>
  <text x="558" y="156" font-size="10" fill="#64748b">React (Vite)</text>
  <text x="558" y="170" font-size="10" fill="#64748b">Progressive Web App</text>
  <text x="558" y="184" font-size="10" fill="#64748b">TOTP + ECDSA clientseitig</text>

  <!-- Admin Container -->
  <rect x="730" y="112" width="172" height="90" rx="10" fill="#fff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="730" y="112" width="172" height="28" rx="10" fill="#ede9fe"/>
  <rect x="730" y="130" width="172" height="2" fill="#c4b5fd"/>
  <circle cx="748" cy="126" r="7" fill="none" stroke="#7c3aed" stroke-width="1.2"/>
  <circle cx="748" cy="126" r="2" fill="#7c3aed"/>
  <text x="762" y="130" font-size="11" font-weight="600" fill="#1e293b">Admin-Dashboard</text>
  <text x="746" y="156" font-size="10" fill="#64748b">React (Vite)</text>
  <text x="746" y="170" font-size="10" fill="#64748b">CSV-Import, Verwaltung</text>
  <text x="746" y="184" font-size="10" fill="#64748b">Rollen: Admin, Lehrkraft</text>

  <!-- API Container -->
  <rect x="600" y="222" width="220" height="90" rx="10" fill="#fff" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="600" y="222" width="220" height="28" rx="10" fill="#1e293b"/>
  <rect x="600" y="240" width="220" height="2" fill="#475569"/>
  <!-- Python icon -->
  <circle cx="618" cy="236" r="7" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="614" y="240" font-size="8" font-weight="700" fill="#fbbf24">Py</text>
  <text x="632" y="240" font-size="11" font-weight="600" fill="#e2e8f0">API-Server (FastAPI)</text>
  <text x="616" y="268" font-size="10" fill="#64748b">Authentifizierung (JWT, bcrypt)</text>
  <text x="616" y="282" font-size="10" fill="#64748b">QR-Verifizierung (TOTP, ECDSA)</text>
  <text x="616" y="296" font-size="10" fill="#64748b">Rate Limiting, Audit-Log</text>

  <!-- Arrows: Reverse Proxy to Frontend containers -->
  <path d="M 476 310 L 600 267" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <!-- Label on arrow -->
  <text x="505" y="275" font-size="8.5" fill="#64748b" transform="rotate(-5, 505, 275)">REST API</text>

  <!-- Arrows within Docker: PWA/Admin to API -->
  <line x1="628" y1="210" x2="680" y2="218" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr)"/>
  <line x1="816" y1="210" x2="760" y2="218" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr)"/>

  <!-- ===== Internal Network Zone ===== -->
  <rect x="526" y="340" width="390" height="206" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1" opacity="0.4"/>
  <text x="540" y="358" font-size="9" font-weight="600" fill="#dc2626" letter-spacing="0.06em">INTERNES NETZWERK (kein Internet)</text>

  <!-- Lock icon for internal network -->
  <rect x="746" y="346" width="14" height="10" rx="2" fill="none" stroke="#dc2626" stroke-width="1.2"/>
  <path d="M 748 346 L 748 342 Q 748 338 753 338 Q 758 338 758 342 L 758 346" fill="none" stroke="#dc2626" stroke-width="1.2"/>

  <!-- Database Container -->
  <rect x="600" y="380" width="220" height="150" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="600" y="380" width="220" height="28" rx="10" fill="#0f172a"/>
  <rect x="600" y="398" width="220" height="2" fill="#334155"/>
  <!-- DB cylinder icon -->
  <ellipse cx="618" cy="390" rx="7" ry="4" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="611" y1="390" x2="611" y2="398" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="625" y1="390" x2="625" y2="398" stroke="#38bdf8" stroke-width="1.2"/>
  <path d="M 611 398 Q 618 404 625 398" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="632" y="397" font-size="11" font-weight="600" fill="#e2e8f0">PostgreSQL 16</text>

  <text x="616" y="428" font-size="10" fill="#64748b">Schuelerdaten, Fotos</text>
  <text x="616" y="442" font-size="10" fill="#64748b">Admin-Konten (bcrypt)</text>
  <text x="616" y="456" font-size="10" fill="#64748b">TOTP-Secrets, Public Keys</text>
  <text x="616" y="470" font-size="10" fill="#64748b">Session-Hashes (SHA-256)</text>
  <text x="616" y="484" font-size="10" fill="#64748b">Audit-Log</text>

  <!-- Persistent Volume icon -->
  <rect x="616" y="496" width="120" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="676" y="511" text-anchor="middle" font-size="9" fill="#475569">Persistentes Volume</text>

  <!-- Arrow: API to Database -->
  <line x1="710" y1="320" x2="710" y2="372" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="720" y="350" font-size="8.5" fill="#3b82f6">SQL</text>

  <!-- X marks: No direct access from frontends to DB -->
  <text x="554" y="406" font-size="16" font-weight="700" fill="#dc2626" opacity="0.6">&#x2715;</text>
  <text x="540" y="422" font-size="8" fill="#dc2626">Kein direkter</text>
  <text x="540" y="432" font-size="8" fill="#dc2626">DB-Zugriff</text>

  <!-- Legend -->
  <rect x="30" y="62" width="130" height="50" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="46" y="80" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.04em">LEGENDE</text>
  <line x1="46" y1="92" x2="66" y2="92" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="72" y="96" font-size="9" fill="#64748b">Datenfluss</text>
  <line x1="46" y1="104" x2="66" y2="104" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="72" y="108" font-size="9" fill="#64748b">Interner Aufruf</text>
</svg>
